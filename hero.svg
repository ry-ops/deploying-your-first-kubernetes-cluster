<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">Deploy your first Kubernetes cluster with K3s</title>
  <desc id="d">Run the install script and a lightweight K3s cluster comes up — a control-plane node and two agents. Apply the manifests and the pods turn green: running. A tutorial toolkit for K3s.</desc>
  <defs><linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#ffc61c"/><stop offset=".5" stop-color="#326ce5"/><stop offset="1" stop-color="#3ddc84"/></linearGradient></defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#e6ebf5; }
    .muted { fill:#8b96ad; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes cmd { 0%,3.33% { opacity:0; transform:translateY(6px); } 7.22%,93.33% { opacity:1; transform:translateY(0); } 96.67%,100% { opacity:0 } } .cmd { animation:cmd 9.0s infinite; }
    @keyframes cp { 0%,15.56% { opacity:0; transform:scale(.6); } 19.44%,93.33% { opacity:1; transform:scale(1); } 96.67%,100% { opacity:0 } } .cp { animation:cp 9.0s infinite; }
    @keyframes a1 { 0%,24.44% { opacity:0; transform:scale(.6); } 28.33%,93.33% { opacity:1; transform:scale(1); } 96.67%,100% { opacity:0 } } .a1 { animation:a1 9.0s infinite; }
    @keyframes a2 { 0%,31.11% { opacity:0; transform:scale(.6); } 35.00%,93.33% { opacity:1; transform:scale(1); } 96.67%,100% { opacity:0 } } .a2 { animation:a2 9.0s infinite; }
    @keyframes pod0 { 0%,44.44% { fill:#3a4459 } 47.78%,95.56% { fill:#3ddc84 } 100% { fill:#3a4459 } } .pod0 { animation:pod0 9.0s infinite; }
    @keyframes pod1 { 0%,47.22% { fill:#3a4459 } 50.56%,95.56% { fill:#3ddc84 } 100% { fill:#3a4459 } } .pod1 { animation:pod1 9.0s infinite; }
    @keyframes pod2 { 0%,50.00% { fill:#3a4459 } 53.33%,95.56% { fill:#3ddc84 } 100% { fill:#3a4459 } } .pod2 { animation:pod2 9.0s infinite; }
    @keyframes pod3 { 0%,52.78% { fill:#3a4459 } 56.11%,95.56% { fill:#3ddc84 } 100% { fill:#3a4459 } } .pod3 { animation:pod3 9.0s infinite; }
    @keyframes pod4 { 0%,55.56% { fill:#3a4459 } 58.89%,95.56% { fill:#3ddc84 } 100% { fill:#3a4459 } } .pod4 { animation:pod4 9.0s infinite; }
    @keyframes pod5 { 0%,58.33% { fill:#3a4459 } 61.67%,95.56% { fill:#3ddc84 } 100% { fill:#3a4459 } } .pod5 { animation:pod5 9.0s infinite; }
    @keyframes ready { 0%,73.33% { opacity:0; } 77.22%,93.33% { opacity:1; } 96.67%,100% { opacity:0 } } .ready { animation:ready 9.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } [class^=pod] { fill:#3ddc84 } }
  </style>
  <rect width="960" height="400" rx="20" fill="#0f1420"/>
  <text x="40" y="58" font-size="34" font-weight="800" style="fill:url(#title)">Your first K8s cluster</text>
  <text x="42" y="88" font-size="16" class="muted">A production-ready cluster with K3s — lightweight, single binary, up in minutes.</text>

  <!-- terminal -->
  <rect x="40" y="140" width="330" height="210" rx="10" fill="#0b0f18" stroke="#2c3750"/>
  <g class="cmd">
    <text x="58" y="172" font-size="12" class="mono" style="fill:#3ddc84">$ ./scripts/install-k3s.sh</text>
    <text x="58" y="198" font-size="12" class="mono muted">[+] k3s installed</text>
    <text x="58" y="222" font-size="12" class="mono" style="fill:#3ddc84">$ kubectl get nodes</text>
    <text x="58" y="246" font-size="12" class="mono muted">control-plane  Ready</text>
    <text x="58" y="268" font-size="12" class="mono muted">agent-1        Ready</text>
    <text x="58" y="290" font-size="12" class="mono muted">agent-2        Ready</text>
    <text x="58" y="316" font-size="12" class="mono" style="fill:#3ddc84">$ kubectl apply -f manifests/</text>
  </g>

  <text x="600" y="160" font-size="11" font-weight="700" class="muted" letter-spacing=".08em">YOUR CLUSTER</text>
  <g class="cp"><rect x="600" y="170" width="150" height="90" rx="10" fill="#161d2b" stroke="#326ce5" stroke-width="2"/><text x="675" y="192" text-anchor="middle" font-size="12" font-weight="700">control-plane</text><text x="675" y="208" text-anchor="middle" font-size="9" class="muted">k3s server</text></g>
  <g class="a1"><rect x="600" y="280" width="150" height="90" rx="10" fill="#161d2b" stroke="#326ce5" stroke-width="2"/><text x="675" y="302" text-anchor="middle" font-size="12" font-weight="700">agent-1</text><text x="675" y="318" text-anchor="middle" font-size="9" class="muted">k3s agent</text></g>
  <g class="a2"><rect x="770" y="225" width="150" height="90" rx="10" fill="#161d2b" stroke="#326ce5" stroke-width="2"/><text x="845" y="247" text-anchor="middle" font-size="12" font-weight="700">agent-2</text><text x="845" y="263" text-anchor="middle" font-size="9" class="muted">k3s agent</text></g>
  <rect class="pod0" x="620" y="222" width="46" height="24" rx="5" fill="#3a4459"/><rect class="pod1" x="678" y="222" width="46" height="24" rx="5" fill="#3a4459"/><rect class="pod2" x="620" y="332" width="46" height="24" rx="5" fill="#3a4459"/><rect class="pod3" x="678" y="332" width="46" height="24" rx="5" fill="#3a4459"/><rect class="pod4" x="790" y="277" width="46" height="24" rx="5" fill="#3a4459"/><rect class="pod5" x="848" y="277" width="46" height="24" rx="5" fill="#3a4459"/>
  <g class="ready"><rect x="770" y="330" width="150" height="30" rx="8" fill="#123322" stroke="#3ddc84"/><text x="845" y="350" text-anchor="middle" font-size="12" font-weight="700" style="fill:#9ff0c4">pods running ✓</text></g>
</svg>
