apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: multi-tier
data:
  nginx.conf: |
    server {
        listen 80;
        server_name _;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Multi-Tier Application</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }
            .container {
                background: white;
                border-radius: 20px;
                padding: 40px;
                max-width: 800px;
                width: 100%;
                box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            }
            h1 {
                color: #667eea;
                margin-bottom: 10px;
                font-size: 2.5em;
            }
            .subtitle {
                color: #666;
                margin-bottom: 30px;
                font-size: 1.2em;
            }
            .tier {
                background: #f8f9fa;
                border-left: 4px solid #667eea;
                padding: 20px;
                margin: 20px 0;
                border-radius: 8px;
            }
            .tier h2 {
                color: #333;
                margin-bottom: 10px;
                font-size: 1.5em;
            }
            .tier p {
                color: #666;
                line-height: 1.6;
            }
            .status {
                display: inline-block;
                padding: 5px 15px;
                background: #28a745;
                color: white;
                border-radius: 20px;
                font-size: 0.9em;
                margin-top: 10px;
            }
            .features {
                margin-top: 30px;
            }
            .features ul {
                list-style: none;
                padding: 0;
            }
            .features li {
                padding: 10px;
                margin: 5px 0;
                background: #f8f9fa;
                border-radius: 5px;
            }
            .features li:before {
                content: "✓ ";
                color: #28a745;
                font-weight: bold;
                margin-right: 10px;
            }
            #api-response {
                margin-top: 20px;
                padding: 15px;
                background: #e7f3ff;
                border-radius: 8px;
                border-left: 4px solid #007bff;
            }
            button {
                background: #667eea;
                color: white;
                border: none;
                padding: 12px 30px;
                border-radius: 8px;
                font-size: 1em;
                cursor: pointer;
                margin-top: 20px;
                transition: background 0.3s;
            }
            button:hover {
                background: #764ba2;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Multi-Tier Application</h1>
            <p class="subtitle">Three-tier architecture on Kubernetes</p>

            <div class="tier">
                <h2>Frontend Tier</h2>
                <p>Nginx serving static content with reverse proxy to backend API</p>
                <span class="status">✓ Running</span>
            </div>

            <div class="tier">
                <h2>Application Tier</h2>
                <p>Backend API with auto-scaling capabilities (3-10 replicas)</p>
                <span class="status">✓ Running</span>
            </div>

            <div class="tier">
                <h2>Database Tier</h2>
                <p>PostgreSQL database with persistent storage</p>
                <span class="status">✓ Running</span>
            </div>

            <div class="features">
                <h2>Features</h2>
                <ul>
                    <li>Horizontal Pod Autoscaling</li>
                    <li>Persistent Storage</li>
                    <li>Health Checks & Readiness Probes</li>
                    <li>ConfigMaps & Secrets</li>
                    <li>Service Discovery</li>
                    <li>Load Balancing</li>
                    <li>Ingress Routing</li>
                </ul>
            </div>

            <button onclick="testAPI()">Test Backend API</button>
            <div id="api-response"></div>
        </div>

        <script>
            async function testAPI() {
                const responseDiv = document.getElementById('api-response');
                responseDiv.innerHTML = 'Calling backend API...';

                try {
                    const response = await fetch('/api/');
                    const data = await response.text();
                    responseDiv.innerHTML = '<strong>Backend Response:</strong><br>' + data;
                } catch (error) {
                    responseDiv.innerHTML = '<strong>Error:</strong> ' + error.message;
                }
            }
        </script>
    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: multi-tier
  labels:
    app: frontend
    tier: presentation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      tier: presentation
  template:
    metadata:
      labels:
        app: frontend
        tier: presentation
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
        - name: html
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: frontend-config
      - name: html
        configMap:
          name: frontend-config

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: multi-tier
  labels:
    app: frontend
    tier: presentation
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app: frontend
    tier: presentation

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: multi-tier
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: app.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
