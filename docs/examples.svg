<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">What you can deploy</title>
  <desc id="d">The toolkit includes core manifests (deployment, service, ingress, configmap) plus three example stacks: monitoring with Prometheus and Grafana, a three-tier app (frontend, backend, database), and a stateful WordPress with MySQL and a persistent volume.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#e6ebf5; }
    .muted { fill:#8b96ad; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes g0 { 0%,4.00% { opacity:0; transform:translateY(10px); } 8.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g0 { animation:g0 10.0s infinite; }
    @keyframes g1 { 0%,9.00% { opacity:0; transform:translateY(10px); } 13.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g1 { animation:g1 10.0s infinite; }
    @keyframes g2 { 0%,14.00% { opacity:0; transform:translateY(10px); } 18.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g2 { animation:g2 10.0s infinite; }
    @keyframes g3 { 0%,19.00% { opacity:0; transform:translateY(10px); } 23.00%,95% { opacity:1; transform:translateY(0); } 100% { opacity:0; } } .g3 { animation:g3 10.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
  <rect width="960" height="420" rx="20" fill="#0f1420"/>
  <text x="40" y="54" font-size="27" font-weight="800">What you can deploy</text>
  <text x="40" y="80" font-size="14" class="muted">Core manifests to learn from, plus three runnable example stacks — all <tspan class="mono">kubectl apply -f</tspan> away.</text>
  <g class="g0"><rect x="40" y="130" width="175" height="250" rx="14" fill="#326ce5" fill-opacity=".08" stroke="#326ce5" stroke-opacity=".55"/><text x="56" y="162" font-size="15" font-weight="700">Core manifests</text><text x="56" y="180" font-size="10" class="muted">the building blocks</text><text x="56" y="200" font-size="12.5" class="mono" style="fill:#326ce5">deployment</text><text x="56" y="226" font-size="12.5" class="mono" style="fill:#326ce5">service</text><text x="56" y="252" font-size="12.5" class="mono" style="fill:#326ce5">ingress</text><text x="56" y="278" font-size="12.5" class="mono" style="fill:#326ce5">configmap</text></g><g class="g1"><rect x="275" y="130" width="175" height="250" rx="14" fill="#ff5c8a" fill-opacity=".08" stroke="#ff5c8a" stroke-opacity=".55"/><text x="291" y="162" font-size="15" font-weight="700">Monitoring</text><text x="291" y="180" font-size="10" class="muted">metrics + dashboards</text><text x="291" y="200" font-size="12.5" class="mono" style="fill:#ff5c8a">Prometheus</text><text x="291" y="226" font-size="12.5" class="mono" style="fill:#ff5c8a">Grafana</text></g><g class="g2"><rect x="510" y="130" width="175" height="250" rx="14" fill="#b58cff" fill-opacity=".08" stroke="#b58cff" stroke-opacity=".55"/><text x="526" y="162" font-size="15" font-weight="700">Multi-tier app</text><text x="526" y="180" font-size="10" class="muted">a 3-tier stack</text><text x="526" y="200" font-size="12.5" class="mono" style="fill:#b58cff">frontend</text><text x="526" y="226" font-size="12.5" class="mono" style="fill:#b58cff">backend</text><text x="526" y="252" font-size="12.5" class="mono" style="fill:#b58cff">database</text></g><g class="g3"><rect x="745" y="130" width="175" height="250" rx="14" fill="#3ddc84" fill-opacity=".08" stroke="#3ddc84" stroke-opacity=".55"/><text x="761" y="162" font-size="15" font-weight="700">WordPress</text><text x="761" y="180" font-size="10" class="muted">a stateful app</text><text x="761" y="200" font-size="12.5" class="mono" style="fill:#3ddc84">wordpress</text><text x="761" y="226" font-size="12.5" class="mono" style="fill:#3ddc84">MySQL + PVC</text></g>
</svg>
